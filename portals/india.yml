# portals/india.yml — Indian companies whose ATS job board responds.
# Checked 2026-11-24: every entry below returned HTTP 200 from its Greenhouse / Lever / Ashby API.
# Adapted from career-ops-india (MIT, see THIRD_PARTY_NOTICES.md); unreachable entries moved to
# india-unverified.yml.
# Added 2026-11-24: 17 global companies whose boards had India AI/ML jobs that day (under
